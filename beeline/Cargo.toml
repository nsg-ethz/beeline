[package]
name = "beeline"
version = "0.1.0"
edition = "2021"
description = "An experiment to explore the feasibility of composing valid BPF code snippets."

[lib]
name = "beeline"
path = "src/proxy.rs"

[[bin]]
name = "beeline"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.17", features = ["derive"] }
common = { path = "../common" }
libbpf-rs = { git = "https://github.com/libbpf/libbpf-rs.git", features = [
    "vendored",
], branch = "master" }
libbpf-sys = "1.4.5"
libc = "0.2.155"
as-bytes = "0.2.0"
serde_yaml = "0.9.34"
serde = { version = "1.0.213", features = ["derive"] }
tokio = { version = "1.41.0", features = ["full"] }
httparse = "1.9.5"
sha2 = "0.10.8"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ktls = "6.0.2"
rcgen = "0.14.6"
rustls = { version = "0.23.35", features = ["ring"] }
tokio-rustls = { version = "0.26.4", features = ["ring"] }

[build-dependencies]
common = { path = "../common" }
libbpf-cargo = "0.24"
serde_yaml = "0.9.34"
serde = { version = "1.0.213", features = ["derive"] }

[dev-dependencies]
rand = "0.8.5"

[package]
name = "ssm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.1"
clap = { version = "4.5.40", features = ["derive"] }
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.14", features = ["tokio"] }
log = "0.4.27"
reqwest = "0.12.20"
tokio = { version = "1.45.1", features = ["full"] }
tracing-subscriber = "0.3.19"

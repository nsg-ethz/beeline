[package]
name = "parser"
version = "0.1.0"
edition = "2021"
description = "An experiment to explore the feasibility of composing valid BPF code snippets."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
libbpf-rs = { version = "0.23.3", features = ["vendored"] }
libc = "0.2.155"

[build-dependencies]
libbpf-cargo = "0.23.3"

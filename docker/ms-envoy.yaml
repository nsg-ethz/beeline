        ports:
            #      - 5775:5775/udp
            #      - 6831:6831/udp
            #      - 6832:6832/udp
            #      - 5778:5778
            - 16686:16686
        #      - 14268:14268
        #      - 9411:9411
        environment:
            - COLLECTOR_ZIPKIN_HTTP_PORT=9411

    sidecar:
        build:
            context: ..
            dockerfile: docker/Dockerfile.echo
        entrypoint: "echo -a 0.0.0.0:8080"
        hostname: sidecar
        networks:
            default:
                ipv4_address: 172.18.0.40
        ports:
            - 9991:9991
        restart: always

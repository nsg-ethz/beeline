name: social-network

networks:
    default:
        ipam:
            config:
                - subnet: 172.18.0.0/24
services:
    social-graph-service:
        build: ../test/social_network
        hostname: social-graph-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.2
        depends_on:
            jaeger-agent:
                condition: service_started
            social-graph-mongodb:
                condition: service_started
        restart: always
        entrypoint: SocialGraphService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    social-graph-mongodb:
        image: mongo:4.4.6
        volumes:
            - type: tmpfs
              target: /data/db
        hostname: social-graph-mongodb
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.4
        restart: always

    social-graph-redis:
        image: redis
        volumes:
            - type: tmpfs
              target: /data/db
        hostname: social-graph-redis
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.5
        restart: always

    # ---

    home-timeline-service:
        build: ../test/social_network
        hostname: home-timeline-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.6
        depends_on:
            jaeger-agent:
                condition: service_started
        restart: always
        entrypoint: HomeTimelineService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    home-timeline-redis:
        image: redis
        volumes:
            - type: tmpfs
              target: /data/db
        hostname: home-timeline-redis
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.8
        restart: always

    # ---

    compose-post-service:
        build: ../test/social_network
        hostname: compose-post-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.9
        restart: always
        depends_on:
            jaeger-agent:
                condition: service_started
        entrypoint: ComposePostService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    # ---

    post-storage-service:
        build: ../test/social_network
        hostname: post-storage-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.11
        ports:
            - 10002:9999
        restart: always
        depends_on:
            jaeger-agent:
                condition: service_started
            post-storage-mongodb:
                condition: service_started
        entrypoint: PostStorageService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    post-storage-memcached:
        image: memcached
        hostname: post-storage-memcached
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.13
        restart: always

    post-storage-mongodb:
        image: mongo:4.4.6
        volumes:
            - type: tmpfs
              target: /data/db
        hostname: post-storage-mongodb
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.14
        restart: always

    # ---

    user-timeline-service:
        build: ../test/social_network
        hostname: user-timeline-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.15
        restart: always
        depends_on:
            jaeger-agent:
                condition: service_started
            user-timeline-mongodb:
                condition: service_started
        entrypoint: UserTimelineService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    user-timeline-redis:
        image: redis
        volumes:
            - type: tmpfs
              target: /data/db
        hostname: user-timeline-redis
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.17
        restart: always

    user-timeline-mongodb:
        image: mongo:4.4.6
        volumes:
            - type: tmpfs
              target: /data/db
        hostname: user-timeline-mongodb
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.18
        restart: always

    # ---

    url-shorten-service:
        build: ../test/social_network
        hostname: url-shorten-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.19
        restart: always
        entrypoint: UrlShortenService
        depends_on:
            jaeger-agent:
                condition: service_started
            url-shorten-mongodb:
                condition: service_started
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    url-shorten-memcached:
        image: memcached
        hostname: url-shorten-memcached
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.21
        restart: always

    url-shorten-mongodb:
        image: mongo:4.4.6
        volumes:
            - type: tmpfs
              target: /data/db
        hostname: url-shorten-mongodb
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.22
        restart: always

    # ---

    user-service:
        build: ../test/social_network
        hostname: user-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.23
        restart: always
        depends_on:
            jaeger-agent:
                condition: service_started
            user-mongodb:
                condition: service_started
        entrypoint: UserService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    user-memcached:
        image: memcached
        hostname: user-memcached
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.25
        restart: always

    user-mongodb:
        image: mongo:4.4.6
        volumes:
            - type: tmpfs
              target: /data/db
        hostname: user-mongodb
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.26
        restart: always

    # ---

    media-service:
        build: ../test/social_network
        hostname: media-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.27
        depends_on:
            jaeger-agent:
                condition: service_started
            media-mongodb:
                condition: service_started
        restart: always
        entrypoint: MediaService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    media-memcached:
        image: memcached
        hostname: media-memcached
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.29
        restart: always

    media-mongodb:
        image: mongo:4.4.6
        volumes:
            - type: tmpfs
              target: /data/db
        hostname: media-mongodb
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.30
        restart: always

    # ---

    text-service:
        build: ../test/social_network
        hostname: text-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.31
        restart: always
        depends_on:
            jaeger-agent:
                condition: service_started
        entrypoint: TextService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    # ---

    unique-id-service:
        build: ../test/social_network
        hostname: unique-id-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.33
        restart: always
        depends_on:
            jaeger-agent:
                condition: service_started
        entrypoint: UniqueIdService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    # ---

    user-mention-service:
        build: ../test/social_network
        hostname: user-mention-service
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.35
        depends_on:
            jaeger-agent:
                condition: service_started
        restart: always
        entrypoint: UserMentionService
        volumes:
            - ../test/social_network/config-beeline:/social-network-microservices/config

    # ---

    nginx-thrift:
        image: yg397/openresty-thrift:xenial
        hostname: nginx-thrift
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.37
        ports:
            - 8080:8080
        depends_on:
            jaeger-agent:
                condition: service_started
        restart: always
        volumes:
            - ../test/social_network/nginx-web-server/lua-scripts:/usr/local/openresty/nginx/lua-scripts
            - ../test/social_network/nginx-web-server/pages:/usr/local/openresty/nginx/pages
            - ../test/social_network/nginx-web-server/conf/nginx-beeline.conf:/usr/local/openresty/nginx/conf/nginx.conf
            - ../test/social_network/nginx-web-server/jaeger-config.json:/usr/local/openresty/nginx/jaeger-config.json
            - ../test/social_network/gen-lua:/gen-lua
            - ../test/social_network/docker/openresty-thrift/lua-thrift:/usr/local/openresty/lualib/thrift

    media-frontend:
        image: yg397/media-frontend:xenial
        hostname: media-frontend
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.38
        ports:
            - 8081:8080
        restart: always
        depends_on:
            jaeger-agent:
                condition: service_started
        volumes:
            - ../test/social_network/media-frontend/lua-scripts:/usr/local/openresty/nginx/lua-scripts
            - ../test/social_network/media-frontend/conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf

    jaeger-agent:
        image: jaegertracing/all-in-one:1.62.0
        networks:
            default:
                ipv4_address: 172.18.0.39
        ports:
            #      - 5775:5775/udp
            #      - 6831:6831/udp
            #      - 6832:6832/udp
            #      - 5778:5778
            - 16686:16686
            #      - 14268:14268
            #      - 9411:9411
        restart: always
        environment:
            - COLLECTOR_ZIPKIN_HTTP_PORT=9411

    # this will not be used, really
    # it's here to make CPU measurements fair
    sidecar:
        image: envoyproxy/envoy:v1.34-latest
        hostname: sidecar
        extra_hosts:
            - "beeline:host-gateway"
        networks:
            default:
                ipv4_address: 172.18.0.40
        restart: always
        volumes:
            - ../test/social_network/config-beeline/sidecar.yaml:/etc/envoy/envoy.yaml
            - ../res/pem/cert.pem:/res/pem/cert.pem
            - ../res/pem/key.pem:/res/pem/key.pem

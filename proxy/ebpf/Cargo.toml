[package]
name = "proxy-ebpf"
version = "0.1.0"
edition = "2021"
description = "An experiment to explore the feasibility of composing valid BPF code snippets."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.17", features = ["derive"] }
env_logger = "0.11.5"
libbpf-rs = { version = "0.23.3", features = ["vendored"] }
libbpf-sys = "1.4.5"
libc = "0.2.155"
log = "0.4.22"
common = { version = "0.1.0", path = "../common" }

[build-dependencies]
libbpf-cargo = "0.23.3"

[package]
name = "parser-naive"
version = "0.1.0"
edition = "2021"
description = "A naive HTTP parser in userspace"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.87"
clap = { version = "4.5.17", features = ["derive"] }
env_logger = "0.11.5"
log = "0.4.22"
matcher = { version = "0.1.0", path = "../matcher" }
pin-project-lite = "0.2.14"
regex = "1.10.6"
socket2 = "0.5.7"
tokio = { version = "1.40.0", features = ["tokio-macros", "socket2", "rt", "full"] }

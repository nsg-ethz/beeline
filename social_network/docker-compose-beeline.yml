networks:
    default:
        ipam:
            config:
                - subnet: 172.18.0.0/24
services:
    social-graph-app:
        build: .
        hostname: social-graph-app
        networks:
            default:
                ipv4_address: 172.18.0.2
        extra_hosts:
            - "compose-post-service:host-gateway"
        depends_on:
            jaeger-agent:
                condition: service_started
            social-graph-mongodb:
                condition: service_started
        restart: always
        entrypoint: SocialGraphService
        volumes:
            - ./config:/social-network-microservices/config

    social-graph-service:
        image: envoyproxy/envoy:v1.31-latest
        hostname: social-graph-service
        networks:
            default:
                ipv4_address: 172.18.0.3
        extra_hosts:
            - "compose-post-service:host-gateway"
        depends_on:
            social-graph-app:
                condition: service_started
        restart: always
        volumes:
            - ./config/social-graph-sidecar.yaml:/etc/envoy/envoy.yaml

    social-graph-mongodb:
        image: mongo:4.4.6
        hostname: social-graph-mongodb
        networks:
            default:
                ipv4_address: 172.18.0.4
        extra_hosts:
            - "compose-post-service:host-gateway"
        restart: always

    social-graph-redis:
        image: redis
        hostname: social-graph-redis
        networks:
            default:
                ipv4_address: 172.18.0.5
        extra_hosts:
            - "compose-post-service:host-gateway"
        restart: always


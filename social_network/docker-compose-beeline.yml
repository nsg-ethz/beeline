    # ---

    nginx-thrift:
        image: yg397/openresty-thrift:xenial
        hostname: nginx-thrift
        networks:
            default:
                ipv4_address: 172.18.0.37
        extra_hosts:
            - "compose-post-service:host-gateway"
        ports:
            - 8080:8080
        depends_on:
            jaeger-agent:
                condition: service_started
        restart: always
        volumes:
            - ./nginx-web-server/lua-scripts:/usr/local/openresty/nginx/lua-scripts
            - ./nginx-web-server/pages:/usr/local/openresty/nginx/pages
            - ./nginx-web-server/conf/nginx-beeline.conf:/usr/local/openresty/nginx/conf/nginx.conf
            - ./nginx-web-server/jaeger-config.json:/usr/local/openresty/nginx/jaeger-config.json
            - ./gen-lua:/gen-lua
            - ./docker/openresty-thrift/lua-thrift:/usr/local/openresty/lualib/thrift

    media-frontend:
        image: yg397/media-frontend:xenial
        hostname: media-frontend
        networks:
            default:
                ipv4_address: 172.18.0.38
        extra_hosts:
            - "compose-post-service:host-gateway"
        ports:
            - 8081:8080
        restart: always
        depends_on:
            jaeger-agent:
                condition: service_started
        volumes:
            - ./media-frontend/lua-scripts:/usr/local/openresty/nginx/lua-scripts
            - ./media-frontend/conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf

    jaeger-agent:
        image: jaegertracing/all-in-one:1.62.0
        networks:
            default:
                ipv4_address: 172.18.0.39
        extra_hosts:
            - "compose-post-service:host-gateway"
        ports:
            #      - 5775:5775/udp
            #      - 6831:6831/udp
            #      - 6832:6832/udp
            #      - 5778:5778
            - 16686:16686
            #      - 14268:14268
            #      - 9411:9411
        restart: always
        environment:
            - COLLECTOR_ZIPKIN_HTTP_PORT=9411

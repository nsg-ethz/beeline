static_resources:
    listeners:
        - name: listener_0
          address:
              socket_address:
                  address: 0.0.0.0
                  port_value: 9991
          filter_chains:
              - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          http_filters:
                              - name: envoy.filters.http.router
                                typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          codec_type: auto
                          stat_prefix: ingress_http
                          route_config:
                              virtual_hosts:
                                  - name: gateway
                                    domains:
                                        - "*"
                                    require_tls: EXTERNAL_ONLY
                                    routes:
                                        - match:
                                              prefix: "/recommendations"
                                          route:
                                              cluster: frontend
                                        - match:
                                              prefix: "/hotels"
                                          route:
                                              cluster: frontend
                transport_socket:
                    name: envoy.transport_sockets.tls
                    typed_config:
                        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                        common_tls_context:
                            tls_certificates:
                                - certificate_chain:
                                      filename: res/pem/cert.pem
                                  private_key:
                                      filename: res/pem/key.pem
        - name: listener_1
          address:
              socket_address:
                  # Entrypoint for service through Envoy
                  address: 0.0.0.0
                  port_value: 9999
          filter_chains:
              - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          http_filters:
                              - name: envoy.filters.http.router
                                typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          codec_type: auto
                          http2_protocol_options: {}
                          stat_prefix: ingress_http
                          route_config:
                              virtual_hosts:
                                  - name: service
                                    domains:
                                        - "*"
                                    routes:
                                        - match:
                                              prefix: "/geo.Geo/"
                                          request_headers_to_add:
                                              - header:
                                                    key: "X-Processed-By"
                                                    value: "beeline"
                                                append: false
                                          route:
                                              cluster: geo
                                        - match:
                                              prefix: "/rate.Rate/"
                                          request_headers_to_add:
                                              - header:
                                                    key: "X-Processed-By"
                                                    value: "beeline"
                                                append: false
                                          route:
                                              cluster: rate
                                        - match:
                                              prefix: "/search.Search/"
                                          request_headers_to_add:
                                              - header:
                                                    key: "X-Processed-By"
                                                    value: "beeline"
                                                append: false
                                          route:
                                              cluster: search
                                        - match:
                                              prefix: "/recommendation.Recommendation/"
                                          request_headers_to_add:
                                              - header:
                                                    key: "X-Processed-By"
                                                    value: "beeline"
                                                append: false
                                          route:
                                              cluster: recommendation
                                        - match:
                                              prefix: "/reservation.Reservation/"
                                          request_headers_to_add:
                                              - header:
                                                    key: "X-Processed-By"
                                                    value: "beeline"
                                                append: false
                                          route:
                                              cluster: reservation
                                        - match:
                                              prefix: "/profile.Profile/"
                                          request_headers_to_add:
                                              - header:
                                                    key: "X-Processed-By"
                                                    value: "beeline"
                                                append: false
                                          route:
                                              cluster: profile

    clusters:
        - name: frontend
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          circuit_breakers:
              thresholds:
                  - priority: DEFAULT
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000
                  - priority: HIGH
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000

          load_assignment:
              cluster_name: frontend
              endpoints:
                  - lb_endpoints:
                        - endpoint:
                              address:
                                  socket_address:
                                      address: 172.18.0.3
                                      port_value: 5000
        - name: profile
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          http2_protocol_options: {}
          circuit_breakers:

    listeners:
        - name: listener0
          address:
              socket_address:
                  address: 0.0.0.0
                  port_value: 9999

          filter_chains:
              - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          stat_prefix: ingress_http
                          codec_type: AUTO
                          route_config:
                              name: local_route
                              virtual_hosts:
                                  - name: service
                                    domains: ["*"]
                                    routes:
                                        - match:
                                              path: "/service-1"
                                          route: { cluster: service-1 }
                                        - match:
                                              path: "/service-2"
                                          route: { cluster: service-2 }
                                        - match:
                                              path: "/service-3"
                                          route: { cluster: service-3 }
                                        - match:

stats_config:
    stats_matcher:
        reject_all: true
static_resources:
    clusters:
        - name: service-1
          connect_timeout: 3s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          circuit_breakers:
              thresholds:
                  - priority: DEFAULT
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000
                  - priority: HIGH
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000

          load_assignment:
              cluster_name: service-1
              endpoints:
                  - lb_endpoints:
                        - endpoint:
                              address:
                                  socket_address:
                                      address: 172.18.0.3
                                      port_value: 9999
        - name: service-2
          connect_timeout: 3s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          circuit_breakers:
              thresholds:
                  - priority: DEFAULT
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000
                  - priority: HIGH
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000

          load_assignment:
              cluster_name: service-2
              endpoints:
                  - lb_endpoints:
                        - endpoint:
                              address:
                                  socket_address:
                                      address: 172.18.0.4
                                      port_value: 9999
        - name: service-3
          connect_timeout: 3s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          circuit_breakers:
              thresholds:
                  - priority: DEFAULT
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000
                  - priority: HIGH
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000

          load_assignment:
              cluster_name: service-3
              endpoints:
                  - lb_endpoints:
                        - endpoint:
                              address:
                                  socket_address:
                                      address: 172.18.0.5
                                      port_value: 9999
    listeners:
        - name: listener0
          address:
              socket_address:
                  address: 0.0.0.0
                  port_value: 9999

          filter_chains:
              - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          stat_prefix: ingress_http
                          codec_type: AUTO
                          route_config:
                              name: local_route
                              virtual_hosts:
                                  - name: service
                                    domains: ["*"]
                                    routes:
                                        - match:
                                              prefix: "/service-1"
                                          request_headers_to_add:
                                              - header:
                                                    key: "a"
                                                    value: ""
                                              - header:
                                                    key: "b"
                                                    value: ""
                                              - header:
                                                    key: "c"
                                                    value: ""
                                              - header:
                                                    key: "d"
                                                    value: ""
                                              - header:
                                                    key: "e"
                                                    value: ""
                                              - header:
                                                    key: "f"
                                                    value: ""
                                              - header:
                                                    key: "g"
                                                    value: ""
                                              - header:
                                                    key: "h"
                                                    value: ""

                                          route: { cluster: service-1 }
                                        - match:
                                              prefix: "/service-2"
                                          request_headers_to_add:
                                              - header:
                                                    key: "a"
                                                    value: ""
                                              - header:
                                                    key: "b"
                                                    value: ""
                                              - header:
                                                    key: "c"
                                                    value: ""
                                              - header:
                                                    key: "d"
                                                    value: ""
                                              - header:
                                                    key: "e"
                                                    value: ""
                                              - header:
                                                    key: "f"
                                                    value: ""
                                              - header:
                                                    key: "g"
                                                    value: ""
                                              - header:
                                                    key: "h"
                                                    value: ""

                                          route: { cluster: service-2 }
                                        - match:
                                              prefix: "/service-3"
                                          request_headers_to_add:
                                              - header:
                                                    key: "a"
                                                    value: ""
                                              - header:
                                                    key: "b"
                                                    value: ""
                                              - header:
                                                    key: "c"
                                                    value: ""
                                              - header:
                                                    key: "d"
                                                    value: ""
                                              - header:
                                                    key: "e"
                                                    value: ""
                                              - header:
                                                    key: "f"
                                                    value: ""
                                              - header:
                                                    key: "g"
                                                    value: ""
                                              - header:
                                                    key: "h"
                                                    value: ""

                                          route: { cluster: service-3 }
                          http_filters:
                              - name: envoy.filters.http.router
                                typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

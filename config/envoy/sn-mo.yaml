static_resources:
    listeners:
        - name: listener_0
          address:
              socket_address:
                  # Entrypoint for service through Envoy
                  address: 0.0.0.0
                  port_value: 9999
          filter_chains:
              - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          http_filters:
                              - name: envoy.filters.http.router
                                typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          codec_type: auto
                          stat_prefix: ingress_http
                          route_config:
                              virtual_hosts:
                                  - name: service
                                    domains:
                                        - "*"
                                    routes:
                                        - match:
                                              path: "/compose-post-service"
                                          route:
                                              cluster: compose-post-service
                                        - match:
                                              path: "/compose-post-redis"
                                          route:
                                              cluster: compose-post-redis
                                        - match:
                                              path: "/write-home-timeline-service"
                                          route:
                                              cluster: write-home-timeline-service
                                        - match:
                                              path: "/media-service"
                                          route:
                                              cluster: media-service
                                        - match:
                                              path: "/post-storage-service"
                                          route:
                                              cluster: post-storage-service
                                        - match:
                                              path: "/social-graph-service"
                                          route:
                                              cluster: social-graph-service
                                        - match:
                                              path: "/social-graph-mongodb"
                                          route:
                                              cluster: social-graph-mongodb
                                        - match:
                                              path: "/social-graph-redis"
                                          route:
                                              cluster: social-graph-redis
                                        - match:
                                              path: "/text-service"
                                          route:
                                              cluster: text-service
                                        - match:
                                              path: "/unique-id-service"
                                          route:
                                              cluster: unique-id-service
                                        - match:
                                              path: "/url-shorten-service"
                                          route:
                                              cluster: url-shorten-service
                                        - match:
                                              path: "/url-shorten-memcached"
                                          route:
                                              cluster: url-shorten-memcached
                                        - match:
                                              path: "/user-mention-service"
                                          route:
                                              cluster: user-mention-service
                                        - match:
                                              path: "/user-service"
                                          route:
                                              cluster: user-service
                                        - match:
                                              path: "/user-mongodb"
                                          route:
                                              cluster: user-mongodb
                                        - match:
                                              path: "/user-memcached"
                                          route:
                                              cluster: user-memcached
                                        - match:
                                              path: "/user-timeline-service"
                                          route:
                                              cluster: user-timeline-service
                                        - match:
                                              path: "/user-timeline-mongodb"
                                          route:
                                              cluster: user-timeline-mongodb
                                        - match:
                                              path: "/user-timeline-redis"
                                          route:
                                              cluster: user-timeline-redis
                                        - match:
                                              path: "/home-timeline-service"
                                          route:
                                              cluster: home-timeline-service
    clusters:
        - name: compose-post-service
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          circuit_breakers:
              thresholds:
                  - priority: DEFAULT
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000
                  - priority: HIGH
                    max_connections: 1000000000
                    max_pending_requests: 1000000000
                    max_requests: 1000000000
                    max_retries: 1000000000

          load_assignment:
              cluster_name: compose-post-service
              endpoints:
                  - lb_endpoints:
                        - endpoint:
                              address:
                                  socket_address:
                                      address: 172.18.0.9
                                      port_value: 9999


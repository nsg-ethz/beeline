socket: 172.17.0.1:9999
proxy: 172.18.0.254:9999
accelerate: 172.18.0.0/24
stats: true
hosts:
    - name: service-1
      instances:
          - 172.18.0.3:9999
    - name: service-2
      instances:
          - 172.18.0.4:9999
    - name: service-3
      instances:
          - 172.18.0.5:9999
policies:
    - name: allow-get-to-service-1
      path: "/debug/service-1"
      method: GET
      destination_port: 8888
      allow: true
    - name: allow-get-to-service-2
      path: "/debug/service-2"
      method: GET
      destination_port: 8888
      allow: true
    - name: allow-get-to-service-3
      path: "/debug/service-2"
      method: GET
      destination_port: 8888
      allow: true
    - name: allow-admin
      path: "/admin"
      method: GET
      source_ip: 172.18.0.1
      destination_port: 7777
      allow: true
routes:
    - match:
          path: "/service-1"
          filters:
              - type: jwt
                secret: "testtest12345678"
                audience: 
                issuer: beeline
          headers:
              a: 
              b: 
              c: 
              d: 
      dest: service-1
    - match:
          path: "/service-2"
          filters:
              - type: jwt
                secret: "testtest12345678"
                audience: 
                issuer: beeline
          headers:
              a: 
              b: 
              c: 
              d: 
      dest: service-2
    - match:
          path: "/service-3"
          filters:
              - type: jwt
                secret: "testtest12345678"
                audience: 
                issuer: beeline
          headers:
              a: 
              b: 
              c: 
              d: 
      dest: service-3

socket: 172.17.0.1:9999
hosts:
    - name: service-1
      instances:
          - 172.18.0.3:9999
    - name: service-2
      instances:
          - 172.18.0.4:9999
    - name: service-3
      instances:
          - 172.18.0.5:9999
routes:
    - match:
          path: "/service-1"
      dest: service-1
      filters:
          - type: jwt
            secret: "testtest12345678"
            audience: 
            issuer: beeline
          - type: mutate
            remove:
                - authorization
    - match:
          path: "/service-2"
      dest: service-2
      filters:
          - type: jwt
            secret: "testtest12345678"
            audience: 
            issuer: beeline
          - type: mutate
            remove:
                - authorization
    - match:
          path: "/service-3"
      dest: service-3
      filters:
          - type: jwt
            secret: "testtest12345678"
            audience: 
            issuer: beeline
          - type: mutate
            remove:
                - authorization

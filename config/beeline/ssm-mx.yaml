socket: 172.17.0.1:9999
proxy: 172.18.0.254:9999
accelerate: 172.18.0.0/24
stats: true
hosts:
    - name: service-1
      instances:
          - 172.18.0.3:9999
    - name: service-2
      instances:
          - 172.18.0.4:9999
    - name: service-3
      instances:
          - 172.18.0.5:9999
    - name: service-4
      instances:
          - 172.18.0.6:9999
    - name: service-5
      instances:
          - 172.18.0.7:9999
    - name: service-6
      instances:
          - 172.18.0.8:9999
routes:
    - match:
          path: "/service-1"
      dest: proxy
    - match:
          path: "/service-2"
      dest: proxy
    - match:
          path: "/service-3"
      dest: proxy
    - match:
          path: "/service-4"
      dest: proxy
    - match:
          path: "/service-5"
      dest: proxy
    - match:
          path: "/service-6"
      dest: proxy

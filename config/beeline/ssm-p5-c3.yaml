socket: 172.17.0.1:9999
stats: true
hosts:
    - name: service-1
      instances:
          - 172.18.0.3:9999
    - name: service-2
      instances:
          - 172.18.0.4:9999
    - name: service-3
      instances:
          - 172.18.0.5:9999
policies:
    - name: allow-get-to-service-1
      path: "/debug/service-1"
      method: GET
      destination_port: 8888
      allow: true
    - name: allow-get-v2-to-service-1
      path: "/v2/service-1"
      method: POST
      destination_port: 9998
      allow: true
    - name: allow-get-to-service-2
      path: "/debug/service-2"
      method: GET
      destination_port: 8888
      allow: true
    - name: allow-get-v2-to-service-2
      path: "/v2/service-2"
      method: POST
      destination_port: 9998
      allow: true
    - name: allow-get-to-service-3
      path: "/debug/service-3"
      method: GET
      destination_port: 8888
      allow: true
    - name: allow-get-v2-to-service-3
      path: "/v2/service-3"
      method: POST
      destination_port: 9998
      allow: true
    - name: allow-admin
      path: "/admin"
      method: GET
      source_ip: 172.18.0.1
      destination_port: 7777
      allow: true
    - name: allow-dev
      path: "/dev"
      method: GET
      source_ip: 172.18.0.1
      destination_port: 7777
      allow: true
    - name: allow-stats
      path: "/stats"
      method: GET
      source_ip: 172.18.0.1
      destination_port: 3333
      allow: true
    - name: deny-post-to-service-1
      path: "/service-1"
      method: POST
      source_ip: 172.18.0.3
      destination_port: 9999
      allow: false
    - name: deny-post-to-service-2
      path: "/service-2"
      method: POST
      source_ip: 172.18.0.4
      destination_port: 9999
      allow: false
    - name: deny-post-to-service-3
      path: "/service-3"
      method: POST
      source_ip: 172.18.0.5
      destination_port: 9999
      allow: false
    - name: allow-post-to-service-2
      path: "/service-2"
      method: POST
      destination_port: 9999
      allow: true
    - name: allow-post-to-service-3
      path: "/service-3"
      method: POST
      destination_port: 9999
      allow: true
    - name: allow-post-to-service-1
      path: "/service-1"
      method: POST
      destination_port: 9999
      allow: true
    - name: allow-post-to-service-2
      path: "/service-2"
      method: POST
      destination_port: 9999
      allow: true
    - name: allow-post-to-service-3
      path: "/service-3"
      method: POST
      destination_port: 9999
      allow: true
routes:
    - match:
          path: "/service-1"
      dest: service-1
    - match:
          path: "/service-2"
      dest: service-2
    - match:
          path: "/service-3"
      dest: service-3

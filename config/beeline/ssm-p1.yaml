socket: 172.17.0.1:9999
proxy: 172.18.0.254:9999
accelerate: 172.18.0.0/24
stats: true
hosts:
    - name: service-1
      instances:
          - 172.18.0.3:9999
    - name: service-2
      instances:
          - 172.18.0.4:9999
    - name: service-3
      instances:
          - 172.18.0.5:9999
routes:
    - match:
          path: "/service-1"
      dest: service-1
    - match:
          path: "/service-2"
      dest: service-2
    - match:
          path: "/service-3"
      dest: service-3

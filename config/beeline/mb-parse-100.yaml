hosts:
    - name: server1
      instances:
          - 127.0.0.1:8001

routes:
    - match:
          path: "*"
          headers:
              aaaaaaa: 1
              bbbbbbb: 2
              ccccccc: 3
              ddddddd: 4
              fffffff: 5
              ggggggg: 6
      dest: server1

      method: POST
      destination_port: 9999
      allow: true
    - name: allow-stats
      path: "/stats-1"
      method: GET
      source_ip: 172.18.0.1
      destination_port: 3333
      allow: true
    - name: allow-post-to-service-1
      path: "/service-1/v2"
      method: POST
      destination_port: 9999
      allow: true
    - name: allow-post-to-service-2

socket: 172.17.0.1:9999
proxy: 172.18.0.254:9999
accelerate: 172.18.0.0/24
stats: true
hosts:
    - name: service-1
      load_balancer:
          type: ring
          size: 50
      instances:
          - 172.18.0.3:9999
          - 172.18.0.6:9999
          - 172.18.0.9:9999
    - name: service-2
      load_balancer:
          type: ring
          size: 50
      instances:
          - 172.18.0.4:9999
          - 172.18.0.7:9999
          - 172.18.0.10:9999
    - name: service-3

          type: ring
          size: 50
      instances:
          - 172.18.0.5:9999
          - 172.18.0.8:9999
          - 172.18.0.11:9999
policies:
    - name: allow-post-to-service-1
      path: "/service-1"
      method: POST
      destination_port: 9999
      allow: true
    - name: allow-post-to-service-2
      path: "/service-2"
      method: POST
      destination_port: 9999
      allow: true
    - name: allow-post-to-service-3

socket: 172.17.0.1:9999
proxy: 172.18.0.254:9999
accelerate: 172.18.0.0/24
stats: true
hosts:
    - name: service-1
      instances:
          - 172.18.0.3:9999
    - name: service-2
      instances:
          - 172.18.0.4:9999
    - name: service-3
      instances:
          - 172.18.0.5:9999
policies:
    - name: allow-post-to-service-1
      path: "/service-1"
      method: POST
      destination_port: 9999
      allow: true
    - name: allow-post-to-service-2
      path: "/service-2"
      method: POST
      destination_port: 9999
      allow: true
routes:
    - match:
          path: "/service-1"
          filters:
              - type: jwt
                secret: "testtest12345678"
                audience: echo
                issuer: beeline
          headers:
              a: 
              b: 
      dest: service-1
    - match:
          path: "/service-2"
          filters:
              - type: jwt
                secret: "testtest12345678"
                audience: echo
                issuer: beeline
          headers:
              a: 
              b: 
      dest: service-2
    - match:
          path: "/service-3"
          filters:
              - type: jwt
                secret: "testtest12345678"
                audience: echo
                issuer: beeline
          headers:
              a: 
              b: 
      dest: service-3

      load_balancer:
          type: ring
          size: 50
      instances:
          - 172.18.0.3:9999
          - 172.18.0.6:9999
          - 172.18.0.9:9999
    - name: service-2
      load_balancer:
          type: ring
          size: 50
      instances:
          - 172.18.0.4:9999
          - 172.18.0.7:9999
          - 172.18.0.10:9999
    - name: service-3
      load_balancer:
          type: ring
          size: 50
      instances:
          - 172.18.0.5:9999
          - 172.18.0.8:9999
          - 172.18.0.11:9999

routes:
    - match:
          path: "/service-1"
      headers:
          asdf: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      dest: service-1
    - match:
          path: "/service-2"
      headers:
          asdf: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      dest: service-2
    - match:
          path: "/service-3"
      headers:
          asdf: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      dest: service-3

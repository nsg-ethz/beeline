socket: 172.17.0.1:9999
stats: true
hosts:
    - name: service-1
      instances:
          - 172.18.0.3:9999
    - name: service-2
      instances:
          - 172.18.0.4:9999
    - name: service-3
      instances:
          - 172.18.0.5:9999
policies:
    - name: only-allow-post-to-service-1
      path: "/service-1"
      method: POST
      destination_port: 9999
      allow: true
routes:
    - match:
          path: "/service-1"
      dest: service-1
    - match:
          path: "/service-2"
      dest: service-2
    - match:
          path: "/service-3"
      dest: service-3

proxy: 127.0.0.1:9999
stats: true
hosts:
    - name: server1
      instances:
          - 127.0.0.1:8001
    - name: server2
      load_balancer:
          type: ring
          size: 50
      instances:
          - 127.0.0.1:8002
          - 127.0.0.1:8003

routes:
    - match:
          path: "*"
          headers:
              backend: server1
      dest: server1
      filters:
          # - type: jwt
          #   secret: "testtest12345678"
          #   audience: aud1
          #   issuer: iss1
          - type: mutate
            add:
                x-processed-by: beeline
            # remove:
            #     - backend
    - match:
          path: "*"
          headers:
              backend: server2
      dest: server2

socket: 172.17.0.1:9999
accelerate: 172.18.0.0/24
hosts:
    - name: unique-id-service
      instances:
          - 172.18.0.3:9999
    - name: movie-id-service
      instances:
          - 172.18.0.4:9999
    - name: text-service
      instances:
          - 172.18.0.7:9999
    - name: rating-service
      instances:
          - 172.18.0.8:9999
    - name: user-service
      instances:
          - 172.18.0.10:9999
    - name: compose-review-service
      instances:
          - 172.18.0.13:9999
    - name: review-storage-service
      instances:
          - 172.18.0.15:9999
    - name: user-review-service
      instances:
          - 172.18.0.18:9999
    - name: movie-review-service
      instances:
          - 172.18.0.21:9999
    - name: cast-info-service
      instances:
